<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
<defs>
<style>@font-face{font-family:O;src:url(data:font/woff2;base64,) format("woff2")}
.t{font-family:O,Orbitron,sans-serif;font-weight:800}</style>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00FFC6"/><stop offset=".55" stop-color="#00B4FF"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient>
<linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="92" x2="1160" y1="0" y2="0"><stop offset="0" stop-color="#00FFC6"/><stop offset=".55" stop-color="#00B4FF"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#160a2e"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="0" y="0" width="1200" height="110" rx="18"/></clipPath>
<clipPath id="r"><rect x="86" y="22" width="0" height="70"><animate attributeName="width" from="0" to="1090" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.23 1 0.32 1"/></rect></clipPath>
<filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="110" fill="url(#bg)"/>
<g stroke="#00B4FF" stroke-opacity=".08"><path d="M0 0V110"/><path d="M40 0V110"/><path d="M80 0V110"/><path d="M120 0V110"/><path d="M160 0V110"/><path d="M200 0V110"/><path d="M240 0V110"/><path d="M280 0V110"/><path d="M320 0V110"/><path d="M360 0V110"/><path d="M400 0V110"/><path d="M440 0V110"/><path d="M480 0V110"/><path d="M520 0V110"/><path d="M560 0V110"/><path d="M600 0V110"/><path d="M640 0V110"/><path d="M680 0V110"/><path d="M720 0V110"/><path d="M760 0V110"/><path d="M800 0V110"/><path d="M840 0V110"/><path d="M880 0V110"/><path d="M920 0V110"/><path d="M960 0V110"/><path d="M1000 0V110"/><path d="M1040 0V110"/><path d="M1080 0V110"/><path d="M1120 0V110"/><path d="M1160 0V110"/></g>
<rect x="0" y="0" width="1200" height="110" rx="18" fill="none" stroke="url(#g)" stroke-width="2" stroke-opacity=".7"/>
<!-- 3D cube icon -->
<g transform="translate(46 55)" filter="url(#gl)" fill="none" stroke="url(#g)" stroke-width="2" stroke-linejoin="round">
 <path d="M0 -22L19 -11V11L0 22L-19 11V-11Z"><animate attributeName="stroke-opacity" values="1;.55;1" dur="3.2s" repeatCount="indefinite"/></path>
 <path d="M0 -22V0M0 0L19 11M0 0L-19 11" stroke-opacity=".75"/>
 <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;0.78 1;1 1" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="0.77 0 0.175 1;0.77 0 0.175 1"/>
</g>
<!-- title with clip reveal -->
<g clip-path="url(#r)">
<text class="t" x="92" y="62" font-size="38" fill="url(#g)" letter-spacing="3">ESTADÍSTICAS</text>
<text class="t" x="1160" y="38" font-size="13" fill="#8b9bb4" text-anchor="end" letter-spacing="4">05 / 06</text>
<text class="t" x="1160" y="70" font-size="15" fill="#00B4FF" text-anchor="end" letter-spacing="3">&lt; métricas /&gt;</text>
</g>
<!-- baseline draws in, then a light sweep loops -->
<path d="M92 88H1160" stroke="url(#g2)" stroke-width="2" stroke-dasharray="1200" stroke-dashoffset="1200"><animate attributeName="stroke-dashoffset" from="1200" to="0" dur="1.1s" begin="0.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.23 1 0.32 1"/></path>
<rect x="-220" y="0" width="220" height="110" fill="url(#sw)" opacity=".5" transform="skewX(-20)"><animate attributeName="x" values="-260;1460" dur="5.5s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.77 0 0.175 1"/></rect>
</g></svg>
