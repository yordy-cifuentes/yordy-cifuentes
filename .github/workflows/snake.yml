name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yordy-cifuentes
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00FFC6&color_dots=#161b22,#0b3a52,#0077b6,#00b4ff,#9d4edd
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#b8f5e6,#5fe0c8,#00b4ff,#7c3aed
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
